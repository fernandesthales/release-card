name: Test Release Card

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t release-card:ci .

      - name: Start the container
        run: docker run -d --name release-card-ci -p 127.0.0.1:8080:80 release-card:ci

      - name: Verify the page served by Nginx
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/ -o page.html
          grep -F '<h1>Release 2</h1>' page.html

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/fernandesthales/release-card:sha-${GITHUB_SHA}"
          docker tag release-card:ci "$image"
          docker push "$image"
          echo "Published image: $image" >> "$GITHUB_STEP_SUMMARY"